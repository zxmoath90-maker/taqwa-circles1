<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet"><title>حلقات جامعة التقوى</title>
<style>:root{--b:#5b3416;--b2:#7a4a22;--iv:#fbf6ec;--be:#ead9bd;--t:#2a1a0c}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",sans-serif;background:var(--iv);color:var(--t)}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:3px solid var(--b)}header img{height:64px}header h1{font-size:20px;color:var(--b);margin:0;flex:1}
.hero{position:relative;overflow:hidden;min-height:480px;display:flex;align-items:center;justify-content:center;padding:24px 12px;background:linear-gradient(rgba(58,32,15,.28),rgba(58,32,15,.28)),url(hero.jpg) center 62%/cover #e9c88c}.hp{text-align:center;position:relative;background:rgba(251,246,236,.88);border-radius:22px;padding:22px 30px;max-width:620px;box-shadow:0 8px 30px #4a2a1233}.hp h1{color:var(--b);font-family:Amiri,Tahoma,serif;font-size:34px;margin:8px 0}.hero0{background:linear-gradient(rgba(251,246,236,.88),rgba(251,246,236,.95)),radial-gradient(circle at 80% 10%,#f3d99a,#c9a46a 60%,#7a4a22);text-align:center;padding:48px 16px}.hero img{width:200px;max-width:60%}
main{max-width:1000px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--be);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #5b34160f}
button{background:var(--b);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer}button.s{background:var(--be);color:var(--b)}button:disabled{opacity:.5}
input,select,textarea{text-align:right;font:inherit;font-size:16px;-webkit-user-select:text;user-select:text;padding:9px;border:1px solid #cdb792;border-radius:10px;width:100%;margin:4px 0;background:#fffdf8}.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.shell{display:flex;min-height:100vh}#sb{width:272px;flex:none;background:linear-gradient(180deg,#5b3416,#3a200f);color:#f5e9d3;padding:16px 0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.sl{text-align:center;padding:0 16px 12px;border-bottom:1px solid #ffffff2a}.sl img{width:112px;background:#fbf6ec;border-radius:14px;padding:6px}.sl b{display:block;margin-top:6px;font-size:15px}
.sn{display:flex;flex-direction:column;flex:1;padding:6px 12px;margin:0;flex-wrap:nowrap}.sh{font-size:12px;color:#d9bf94;margin:16px 8px 4px}.sh.last{margin-top:auto;border-top:1px solid #ffffff2a;padding-top:10px}
.sn a{color:#f5e9d3;text-decoration:none;padding:10px 12px;border-radius:10px;margin:1px 0;font-size:15px}.sn a:hover{background:#ffffff18}.sn a.on{background:#fbf6ec;color:#5b3416;font-weight:bold}
.mc{flex:1;min-width:0}.top{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--be);position:sticky;top:0;z-index:5}.top h2{margin:0;color:var(--b);font-size:20px}.mb{display:none}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.st .card{margin:0;text-align:center}.st b{display:block;font-size:28px;color:var(--b)}.ft{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.ft .card{text-align:center;border-top:4px solid var(--b2)}
body{overflow-x:hidden}.top{flex-wrap:wrap}@media(max-width:800px){.un{display:none}.top h2{font-size:16px}#sb{width:min(272px,82vw);position:fixed;right:0;top:0;z-index:20;transform:translateX(100%);transition:transform .2s}#sb.open{transform:none}.mb{display:inline-block}.top{padding:10px 12px}}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--be);text-align:right}.tw{overflow-x:auto}
.bd{background:#c0392b;color:#fff;border-radius:10px;padding:0 7px;margin-inline-start:6px}input[dir=ltr]{text-align:left}.hint{background:#fff8e6;color:#6b4a20;padding:8px 20px;font-size:14px;border-bottom:1px solid var(--be)}.hint:empty{display:none}.err{color:#a11;margin:6px 0}.ok{color:#176b2c}.big{font-size:34px;color:var(--b);font-weight:bold}</style></head><body>
<header><img src="logo.png" alt="شعار حلقات جامعة التقوى"><h1>حلقات جامعة التقوى</h1></header>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');let ME={},TAB='home';
const tm=s=>{try{const d=new Date(String(s).replace(' ','T')+(String(s).length>10?'Z':''));return isNaN(d)?esc(s):d.toLocaleString('ar-SA',{timeZone:'Asia/Riyadh',dateStyle:'short',timeStyle:String(s).length>10?'short':undefined})}catch{return esc(s)}};
const flt=(i,sel)=>{const q=i.value.trim();document.querySelectorAll(sel).forEach(r=>{if(r.querySelector('th'))return;r.style.display=!q||r.textContent.includes(q)?'':'none'})};
const HINT={home:'ملخص اليوم وما يحتاج متابعتك. اضغط «فتح» بجانب أي بند للذهاب إليه.',students:'أضف الطلاب هنا. رمز الدخول وكلمة المرور الأولى متطابقان، ويُطلب من الطالب تغييرها عند أول دخول.',groups:'المجموعات اختيارية. أنشئ مجموعة بلون واحد وأضف إليها الطلاب.',recite:'عرّف مقطعاً مرة واحدة، ثم حدد الطلاب واضغط «تم التسميع». لا تتكرر النقاط للطالب نفسه.',points:'اختر الطالب وأدخل عدداً موجباً للإضافة أو سالباً للخصم.',audit:'كل عمليات النقاط مع من نفّذها ومتى.',vouchers:'أصدر قسيمة بأي قيمة، ثم اطبعها من «طباعة الأوراق والبطاقات».',qr:'أنشئ باركود لطالب محدد ليمسحه جهاز آخر، أو امسح باركوداً من هنا.',print:'اختر الطلاب أو القسائم ثم اضغط طباعة. لا تُطبع كلمات المرور أبداً.',meet:'ابدأ اجتماعاً وسيدخله الطلاب بالميكروفون والكاميرا مغلقين، وتقبلهم من قاعة الانتظار.',messages:'راسل أي طالب أو مشرف. استخدم «إبلاغ» عند رسالة غير مناسبة.',settings:'للمشرف فقط: الرموز، أسماء الطاقم، رابط الموقع، وإخفاء النقاط والترتيب.',prefs:'إعدادات صوت الإشعارات.'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(u,b){const o=b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)};const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'حدث خطأ، حاول مرة أخرى');return j}
const msg=(id,t,ok)=>{const e=$('#'+id);if(e){e.className=ok?'ok':'err';e.textContent=t}};
async function run(id,fn,btn){if(btn)btn.disabled=true;try{await fn()}catch(e){msg(id,e.message)}finally{if(btn)btn.disabled=false}}
async function init(){ME=await api('/api/me');if(!ME.kind)return home();bell();if(!BI)BI=setInterval(bell,20000);if(ME.kind=='student')return ME.must?pw():stud();staffUI()}
function home(){app.innerHTML=`<div class="hero"><div class="hp"><img src="logo.png" alt=""><h1>حلقات جامعة التقوى</h1><p>منصة لإدارة حلقات تحفيظ القرآن الكريم: متابعة التسميع، النقاط، القسائم، والرسائل.</p></div></div><main><div class="g"><button onclick="staffLogin('supervisor')">دخول المشرف</button><button onclick="staffLogin('assistant')">دخول مساعد المشرف</button><button onclick="studLogin()">دخول الطالب</button></div><div class="ft"><div class="card"><h3>متابعة التسميع</h3><p>سجل دقيق لما أتمّه كل طالب مع التاريخ والمسمِّع.</p></div><div class="card"><h3>النقاط والتحفيز</h3><p>نقاط ورسائل تشجيعية وترتيب يتحكم المشرف بإظهاره.</p></div><div class="card"><h3>التسميع عن بعد</h3><p>اجتماعات صوت وفيديو مع قاعة انتظار وتحكم المشرف.</p></div><div class="card"><h3>الرسائل</h3><p>مراسلة خاصة بين الطلاب والمشرفين مع إمكانية الإبلاغ.</p></div><div class="card"><h3>تقدّم الطالب</h3><p>يتابع الطالب إنجازه ومقاطعه المسمَّعة في لوحته.</p></div></div><div id="f"></div></main>`}
function staffLogin(role){$('#f').innerHTML=`<div class="card"><label>رمز الدخول</label><input id="c" type="text" autocomplete="off"><button onclick="run('e',async()=>{const r=await api('/api/staff/code',{role,code:$('#c').value});pick(r)},this)">متابعة</button><div id="e" class="err"></div></div>`}
function pick(r){$('#f').innerHTML=!r.first&&!r.names.length?'<div class="card"><p class="err">لا توجد أسماء مسجّلة لهذا الدور بعد. اطلب من المشرف تسجيل اسمك من الإعدادات.</p></div>':`<div class="card"><b>اختر اسمك من القائمة</b>${r.first?'<p>أول تشغيل: اكتب اسمك لتسجيله مشرفاً.</p><input id="n" placeholder="الاسم">':`<select id="n">${r.names.map(n=>`<option>${esc(n)}</option>`).join('')}</select>`}<button onclick="run('e2',async()=>{await api('/api/staff/pick',{name:$('#n').value});init()},this)">دخول</button><div id="e2" class="err"></div></div>`}
function studLogin(){$('#f').innerHTML=`<div class="card"><label>رمز الطالب</label><input id="c"><label>كلمة المرور</label><input id="p" type="text" autocomplete="off"><button onclick="run('e',async()=>{await api('/api/student/login',{code:$('#c').value,password:$('#p').value});init()},this)">دخول</button><div id="e" class="err"></div></div>`}
function pw(){app.innerHTML=`<main><div class="card"><h2>غيّر كلمة المرور</h2><p>يجب تغييرها قبل المتابعة (أرقام فقط، 4 على الأقل).</p><input id="p" type="text" autocomplete="off"><button onclick="run('e',async()=>{await api('/api/student/password',{password:$('#p').value});init()},this)">حفظ</button><div id="e" class="err"></div></div></main>`}
function stud(){shell('<nav class="sn"><div class="sh">حسابي</div><a class="on">لوحتي</a></nav>','لوحة الطالب',`<div class="card"><h2>مرحباً ${esc(ME.name)}</h2><div class="g"><div>النقاط<div class="big">${ME.points===null?'مخفية':ME.points}</div></div><div>ترتيبك<div class="big">${esc(ME.rank)}</div></div></div><p>${esc(ME.msg)}</p></div><div class="card"><h3>المقاطع المسمَّعة</h3>${ME.done.length?`<div class="tw"><table>${ME.done.map(d=>`<tr><td>${esc(d.name)}</td><td>${tm(d.at)}</td></tr>`).join('')}</table></div>`:'<p>لا توجد مقاطع بعد.</p>'}</div>${soundCard()}<div class="card"><h3>تغيير كلمة المرور</h3><input id="p" type="text" autocomplete="off"><button onclick="run('ep',async()=>{await api('/api/student/password',{password:$('#p').value});msg('ep','تم التغيير',1)},this)">حفظ</button><div id="ep"></div></div><div id="mt0"></div><div id="nf"></div><div id="m"></div>`);meetList('#mt0');notifs();msgs('#m')}
function shell(nav,title,html){app.innerHTML=`<div class="shell"><aside id="sb"><div class="sl"><img src="logo.png" alt=""><b>حلقات جامعة التقوى</b></div>${nav}</aside><div class="mc"><div class="top"><button class="s mb" onclick="$('#sb').classList.toggle('open')">القائمة</button><h2>${title}</h2><span style="flex:1"></span><button class="s" id="bell" onclick="bellGo()">الرسائل</button><span class="un">${esc(ME.name)}</span><button class="s" onclick="api('/api/logout',{}).then(()=>location.reload())">خروج</button></div><div class="hint" id="hint"></div><main id="v">${html}</main></div></div>`;$('header').hidden=true;bell()}
const SEC=[['عام',[['home','الرئيسية']]],['الأشخاص والتنظيم',[['students','الطلاب'],['groups','الحلقات والمجموعات']]],['التسميع والنقاط',[['recite','جدول التسميع'],['points','النقاط'],['audit','سجل العمليات']]],['القسائم والباركود',[['vouchers','إصدار قسائم النقاط'],['qr','تسجيل النقاط بالباركود'],['print','طباعة الأوراق والبطاقات']]],['التواصل',[['meet','التسميع عن بعد'],['messages','الرسائل']]],['النظام',[['settings','الإعدادات'],['prefs','إعداداتي']]]];
function staffUI(){const lab=Object.fromEntries(SEC.flatMap(x=>x[1]));const nav='<nav class="sn">'+SEC.map(([h,it],i)=>`<div class="sh${i==SEC.length-1?' last':''}">${h}</div>`+it.filter(([k])=>k!='settings'||ME.role=='supervisor').map(([k,v])=>`<a href="#" class="${k==TAB?'on':''}" onclick="TAB='${k}';staffUI();return false">${v}</a>`).join('')).join('')+'</nav>';shell(nav,lab[TAB],'جارٍ التحميل...');$('#hint').textContent=HINT[TAB]||'';V[TAB]()}
const V={async students(){const l=await api('/api/students');$('#v').innerHTML=`<div id="pf"></div><div class="card"><h3>إضافة طالب</h3><div class="g"><input id="n" placeholder="اسم الطالب *"><input id="c" placeholder="رمز الدخول (اختياري)"><input id="st" placeholder="المرحلة"><input id="gn" placeholder="اسم ولي الأمر"><input id="gp" placeholder="جوال ولي الأمر"></div><button onclick="run('e',async()=>{const r=await api('/api/students',{name:$('#n').value,code:$('#c').value,stage:$('#st').value,gname:$('#gn').value,gphone:$('#gp').value});alert('الرمز: '+r.code+'\\nكلمة المرور الأولى: '+r.password);staffUI()},this)">إضافة</button><div id="e" class="err"></div></div><div class="card tw"><input placeholder="ابحث بالاسم أو الرمز" oninput="flt(this,'#st tr')"><a href="/api/export/students.csv">تصدير CSV</a><table id="st"><tr><th>الاسم</th><th>الرمز</th><th>الرصيد</th><th>الترتيب</th><th></th></tr>${l.map(s=>`<tr><td><a href="#" onclick="prof(${s.id});return false">${esc(s.name)}</a></td><td>${esc(s.code)}</td><td>${s.bal}</td><td>${s.rank}</td><td><button class="s" onclick="run('e',async()=>{const r=await api('/api/students/${s.id}/reset',{});alert('كلمة مرور مؤقتة: '+r.temp)})">إعادة تعيين</button> <button class="s" onclick="if(confirm('أرشفة الطالب؟'))api('/api/students/${s.id}/archive',{}).then(staffUI)">أرشفة</button></td></tr>`).join('')||'<tr><td>لا يوجد طلاب بعد</td></tr>'}</table></div>`},
async recite(){const[sg,l,su]=await Promise.all([api('/api/segments'),api('/api/students'),api('/api/surahs')]);const op=su.map((x,i)=>`<option value="${i+1}">${esc(x.n)}</option>`).join('');$('#v').innerHTML=`<div class="card"><h3>مقطع جديد</h3><input id="gn" placeholder="اسم المقطع"><div class="g"><div>من سورة<select id="ss">${op}</select><input id="sv" type="number" min="1" placeholder="آية"></div><div>إلى سورة<select id="es">${op}</select><input id="ev" type="number" min="1" placeholder="آية"></div><div>النقاط<input id="pt" type="number" min="0"></div></div><button onclick="run('e',async()=>{await api('/api/segments',{name:$('#gn').value,ss:$('#ss').value,sv:$('#sv').value,es:$('#es').value,ev:$('#ev').value,points:$('#pt').value});staffUI()},this)">حفظ المقطع</button><div id="e" class="err"></div></div><div class="card"><h3>تسجيل تسميع</h3><select id="sg">${sg.map(g=>`<option value="${g.id}">${esc(g.name)} (${g.points} نقطة)</option>`).join('')}</select><input placeholder="ابحث عن طالب" oninput="flt(this,'#rt tr')"><button class="s" onclick="document.querySelectorAll('#rt tr').forEach(r=>{if(r.style.display!='none')r.querySelector('.ck').checked=true})">تحديد الكل الظاهر</button><div class="tw"><table id="rt">${l.map(s=>`<tr><td><input type="checkbox" class="ck" value="${s.id}" style="width:auto"></td><td>${esc(s.name)}</td></tr>`).join('')}</table></div><label><input type="checkbox" id="nt" checked style="width:auto"> إرسال إشعار للطالب</label><br><button onclick="run('e2',async()=>{const ids=[...document.querySelectorAll('.ck:checked')].map(x=>+x.value);const r=await api('/api/complete',{segment_id:$('#sg').value,student_ids:ids,notify:$('#nt').checked});msg('e2','تم: '+r.done.length+' | مكتمل سابقاً: '+r.already.length+' | فشل: '+r.failed.length,1)},this)">تم التسميع</button><div id="e2"></div></div>`},
async points(){const l=await api('/api/students');$('#v').innerHTML=`<div class="card"><div class="g"><select id="s">${l.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.bal})</option>`).join('')}</select><input id="a" type="number" placeholder="المقدار (سالب للخصم)"><input id="r" placeholder="السبب"></div><label><input type="checkbox" id="nt" checked style="width:auto"> إرسال إشعار للطالب</label><br><button onclick="run('e',async()=>{await api('/api/points',{student_id:$('#s').value,amount:$('#a').value,reason:$('#r').value,notify:$('#nt').checked});staffUI()},this)">تنفيذ</button><div id="e" class="err"></div></div><div class="card"><select id="h" onchange="hist(this.value)"><option value="">سجل طالب...</option>${l.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><div id="hh"></div></div>`},
async vouchers(){const[v,l]=await Promise.all([api('/api/vouchers'),api('/api/students')]);$('#v').innerHTML=`<div class="card"><h3>إصدار قسيمة</h3><input id="vv" type="number" min="1" placeholder="القيمة"><input id="vc" type="number" min="1" value="1"><button onclick="run('e',async()=>{await api('/api/vouchers',{value:$('#vv').value,count:$('#vc').value});staffUI()},this)">إصدار</button><div id="e" class="err"></div></div><div class="card"><h3>صرف قسيمة</h3><input id="rc" placeholder="رمز القسيمة"><select id="rs">${l.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label><input type="checkbox" id="nt" checked style="width:auto"> إرسال إشعار للطالب</label><br><button onclick="run('e2',async()=>{const p=await api('/api/vouchers/peek/'+encodeURIComponent($('#rc').value.trim()));if(!confirm('منح '+p.value+' نقطة للطالب المحدد؟'))return;await api('/api/vouchers/redeem',{code:$('#rc').value.trim(),student_id:$('#rs').value,notify:$('#nt').checked});staffUI()},this)">تأكيد الصرف</button><div id="e2" class="err"></div></div><div class="card tw"><table>${v.map(x=>`<tr><td dir="ltr">${esc(x.code)}</td><td>${x.value}</td><td>${{unused:'غير مستخدمة',redeemed:'مصروفة',canceled:'ملغاة'}[x.state]}</td><td>${esc(x.sname||'')}</td></tr>`).join('')}</table></div>`},
async print(){const[l,v,s]=await Promise.all([api('/api/students'),api('/api/vouchers'),api('/api/settings')]);PL=l;PV=v;PU=s.site_url;$('#v').innerHTML=`<div class="card"><h3>بطاقات الطلاب</h3>${PU?'':'<p class="err">حدد رابط الموقع من الإعدادات أولاً.</p>'}<div class="tw"><table>${l.map(x=>`<tr><td><input type="checkbox" class="pc" value="${x.id}" style="width:auto"></td><td>${esc(x.name)}</td></tr>`).join('')||'<tr><td>لا يوجد طلاب</td></tr>'}</table></div><button onclick="pr('c')">طباعة البطاقات المحددة</button></div><div class="card"><h3>القسائم غير المستخدمة</h3><div class="tw"><table>${v.filter(x=>x.state=='unused').map(x=>`<tr><td><input type="checkbox" class="pv" value="${esc(x.code)}" style="width:auto"></td><td>${x.value} نقطة</td><td dir="ltr">${esc(x.code.slice(0,8))}...</td></tr>`).join('')||'<tr><td>لا توجد قسائم</td></tr>'}</table></div><button onclick="pr('v')">طباعة القسائم المحددة</button></div>`},

async function qpeek(t){if(!t)return;try{const p=await api('/api/qrawards/'+encodeURIComponent(t));if(p.status!='pending')return msg('qx','الباركود غير صالح: '+{redeemed:'مستخدم مسبقاً',expired:'منتهي',canceled:'ملغي'}[p.status]);$('#qx').className='';$('#qx').innerHTML=`<p>الطالب: <b>${esc(p.name)}</b><br>النقاط: <b>${p.amount}</b><br>السبب: ${esc(p.reason||'-')}<br>الإشعار: ${p.notify?'سيُرسل':'لن يُرسل'}</p><button id="qc">تأكيد منح النقاط</button>`;$('#qc').onclick=()=>run('qx',async()=>{await api('/api/qrawards/'+encodeURIComponent(t)+'/redeem',{});msg('qx','تم منح النقاط',1)},$('#qc'))}catch(e){msg('qx',e.message)}}
async function scan(){if(!('BarcodeDetector' in window))return msg('qx','متصفحك لا يدعم مسح الباركود بالكاميرا، استخدم الإدخال اليدوي.');try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('#sv');v.style.display='block';v.srcObject=s;await v.play();const d=new BarcodeDetector({formats:['qr_code']});const t=setInterval(async()=>{try{const c=await d.detect(v);if(c[0]){clearInterval(t);s.getTracks().forEach(x=>x.stop());v.style.display='none';qpeek(c[0].rawValue)}}catch{}},400)}catch{msg('qx','تعذّر تشغيل الكاميرا. اسمح بالوصول للكاميرا من إعدادات المتصفح أو استخدم الإدخال اليدوي.')}}
async function prejoin(id){MID=id;app.innerHTML=`<main><div class="card"><h2>قبل الدخول</h2><video id="pv" autoplay muted playsinline style="width:100%;max-width:360px;background:#000;border-radius:12px"></video><label>الميكروفون</label><select id="ms" onchange="getMedia()"></select><label>الكاميرا</label><select id="cs" onchange="getMedia()"></select><p>تدخل والميكروفون والكاميرا مغلقان، وتفتحهما بنفسك بعد الدخول.</p><div id="e" class="err"></div><button onclick="enter()">دخول الاجتماع</button> <button class="s" onclick="location.reload()">رجوع</button></div></main>`;await getMedia();devs()}
async function getMedia(){const e=$('#e');try{if(!navigator.mediaDevices)throw{name:'NS'};LS?.getTracks().forEach(t=>t.stop());const a=$('#ms')?.value,v=$('#cs')?.value;LS=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,...(a&&{deviceId:{exact:a}})},video:v?{deviceId:{exact:v}}:true});$('#pv').srcObject=LS;e.textContent=''}catch(x){LS=null;e.textContent=x.name=='NotAllowedError'?'تم رفض إذن الميكروفون أو الكاميرا. فعّلهما من إعدادات الموقع في المتصفح ثم أعد المحاولة، أو ادخل للاستماع فقط.':x.name=='NotFoundError'?'لم يُعثر على ميكروفون أو كاميرا. يمكنك الدخول للاستماع فقط.':'المتصفح لا يدعم الاجتماعات أو الجهاز مشغول.'}}
async function devs(){const d=await navigator.mediaDevices?.enumerateDevices?.()||[],f=(id,k)=>{const s=$(id);if(!s||s.options.length)return;s.innerHTML=d.filter(x=>x.kind==k).map((x,i)=>`<option value="${esc(x.deviceId)}">${esc(x.label||'جهاز '+(i+1))}</option>`).join('')};f('#ms','audioinput');f('#cs','videoinput')}
async function enter(){try{ICE=await (await fetch('/api/ice')).json()}catch{}LS?.getTracks().forEach(t=>t.enabled=false);app.innerHTML=`<main><div class="card"><b id="st">جارٍ الاتصال...</b><br><button id="bm" onclick="tg('audio')">الميكروفون: مغلق</button> <button id="bc" onclick="tg('video')">الكاميرا: مغلقة</button> <button class="s" onclick="hnd()">رفع اليد</button> <button class="s" onclick="leave()">مغادرة</button></div><div id="tiles" class="g"></div><div class="card" id="pl"></div><div id="rc"></div></main>`;connect()}
const st=t=>{const e=$('#st');if(e)e.textContent=t},sg=(to,data)=>WS.send(JSON.stringify({t:'sig',to,data}));
const closeAll=()=>{Object.values(PC).forEach(p=>p.close());PC={};PE={};document.querySelectorAll('[id^="t-"]').forEach(e=>e.remove())};
function connect(){WS=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);WS.onopen=()=>{st('متصل');WS.send(JSON.stringify({t:'join',m:MID}))};WS.onmessage=e=>{const m=JSON.parse(e.data);Q=Q.then(()=>hm(m)).catch(()=>{})};WS.onclose=()=>{if(!MID)return;st('انقطع الاتصال، تتم إعادة المحاولة...');closeAll();setTimeout(connect,2000)}}
function tile(pid,nm,loc){if($('#t-'+pid))return;const d=document.createElement('div');d.id='t-'+pid;d.className='card';d.innerHTML='<video autoplay playsinline style="width:100%;background:#000;border-radius:10px"></video><div></div>';const v=d.querySelector('video');v.id='v-'+pid;if(loc){v.muted=true;v.srcObject=LS}d.lastChild.textContent=nm;$('#tiles').appendChild(d)}
async function mk(pid,init){const pc=new RTCPeerConnection(ICE);PC[pid]=pc;if(LS)LS.getTracks().forEach(t=>pc.addTrack(t,LS));else['audio','video'].forEach(k=>pc.addTransceiver(k,{direction:'recvonly'}));pc.onicecandidate=e=>e.candidate&&sg(pid,{c:e.candidate});pc.ontrack=e=>{const v=$('#v-'+pid);if(v&&v.srcObject!==e.streams[0])v.srcObject=e.streams[0]};pc.onconnectionstatechange=()=>{if(pc.connectionState=='failed')pc.close()};if(init){await pc.setLocalDescription(await pc.createOffer());sg(pid,{d:pc.localDescription})}return pc}
async function hm(m){if(m.t=='err'){st(m.e);MID=null;WS.close()}
else if(m.t=='me'){MYP=m.pid;if(m.wait)st('بانتظار قبول المشرف لدخولك...');else{st('متصل');tile(MYP,'أنا',1)}}
else if(m.t=='waiting'){WL=m.list;pl()}
else if(m.t=='peers'){for(const p of m.list){PE[p.pid]=p;tile(p.pid,p.name);await mk(p.pid,1)}pl()}
else if(m.t=='joined'){PE[m.p.pid]=m.p;tile(m.p.pid,m.p.name);pl()}
else if(m.t=='left'){PC[m.pid]?.close();delete PC[m.pid];delete PE[m.pid];$('#t-'+m.pid)?.remove();pl()}
else if(m.t=='sig'){const pc=PC[m.from]||await mk(m.from,0),d=m.data;if(d.d){await pc.setRemoteDescription(d.d);if(d.d.type=='offer'){await pc.setLocalDescription(await pc.createAnswer());sg(m.from,{d:pc.localDescription})}}else if(d.c)await pc.addIceCandidate(d.c).catch(()=>{})}
else if(m.t=='hand'){if(PE[m.pid]){PE[m.pid].hand=m.on;pl()}}
else if(m.t=='mute')setT('audio',false)
else if(m.t=='ask'){if(confirm('يطلب منك المشرف فتح الميكروفون. هل توافق؟'))setT('audio',true)}
else if(m.t=='ended'){alert('انتهى الاجتماع');leave()}}
function pl(){const sf=ME.kind=='staff';$('#pl').innerHTML='<h3>المشاركون</h3>'+(ME.kind=='staff'&&WL.length?'<p>بانتظار القبول: '+WL.map(w=>esc(w.name)+` <button onclick="WS.send(JSON.stringify({t:'admit',pid:'${w.pid}'}))">قبول</button>`).join(' ')+'</p>':'')+[{pid:MYP,name:'أنا',me:1},...Object.entries(PE).map(([pid,p])=>({...p,pid}))].map(p=>`<p>${esc(p.name)}${p.staff?' (طاقم)':''}${p.hand?' (رافع يده)':''}${sf&&!p.me?` <button class="s" onclick="WS.send(JSON.stringify({t:'mute',to:'${p.pid}'}))">كتم</button> <button class="s" onclick="WS.send(JSON.stringify({t:'ask',to:'${p.pid}'}))">طلب فتح المايك</button>${p.sid?` <button data-n="${esc(p.name)}" onclick="recPanel(${p.sid},this.dataset.n)">تم التسميع</button>`:''}`:''}</p>`).join('')}
function setT(k,on){const t=LS?.getTracks().find(x=>x.kind==k);if(!t)return alert('لا يتوفر جهاز لذلك');t.enabled=on;$(k=='audio'?'#bm':'#bc').textContent=(k=='audio'?'الميكروفون: ':'الكاميرا: ')+(on?'مفتوح':'مغلق')}
function tg(k){const t=LS?.getTracks().find(x=>x.kind==k);if(!t)return alert('لا يتوفر جهاز. تأكد من إذن المتصفح ثم أعد الدخول.');setT(k,!t.enabled)}
function hnd(){HD=!HD;WS.send(JSON.stringify({t:'hand',on:HD}))}
function leave(){MID=null;WS?.close();closeAll();LS?.getTracks().forEach(t=>t.stop());location.reload()}
async function recPanel(sid,name){const sgs=await api('/api/segments');$('#rc').innerHTML=`<div class="card"><h3>تم التسميع: ${esc(name)}</h3><select id="rs2" onchange="$('#cu').hidden=!!this.value"><option value="">تسميع عام (بدون مقطع)</option>${sgs.map(g=>`<option value="${g.id}" data-p="${g.points}">${esc(g.name)} (${g.points} نقطة)</option>`).join('')}</select><div id="cu"><input id="rd" placeholder="وصف التسميع"><input id="rp" type="number" min="1" placeholder="النقاط"></div><label><input type="checkbox" id="nt" checked style="width:auto"> إرسال إشعار للطالب</label><br><button onclick="run('e9',async()=>{const o=$('#rs2').selectedOptions[0],seg=o.value,amt=seg?o.dataset.p:$('#rp').value;if(!confirm('تأكيد منح '+amt+' نقطة؟'))return;await api('/api/meetings/'+MID+'/recite',{student_id:${sid},segment_id:seg||null,points:$('#rp')?.value,desc:$('#rd')?.value,notify:$('#nt').checked});msg('e9','تم التسجيل',1)},this)">تأكيد</button> <button class="s" onclick="$('#rc').innerHTML=''">إلغاء</button><div id="e9"></div></div>`}
init();
</script></body></html>
